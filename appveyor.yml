configuration: Release

version: 2.0.{build}

image: Visual Studio 2017

build:
    parallel: true
    publish_nuget: true
    verbosity: minimal

before_build:
  - dotnet restore
  
branches:
    only:
      - master

deploy:
  provider: NuGet
  api_key:
    secure: 2k0k7a5s83vtvq7c7p1ir13a
  skip_symbols: false
  artifact: /.*\.nupkg/
  
    

  
  


